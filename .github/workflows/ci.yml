name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type safety across all workspace projects.
      - name: Build
        run: npm run build

      # Codec, acceptance scenarios, and the gateway loop.
      - name: Test
        run: node --test --test-reporter=spec "packages/*/dist/**/*.test.js" "apps/backend/dist/**/*.test.js"

      # The architecture invariants: dependency graph, domain isolation,
      # single-source registries, and truthful user-facing copy.
      - name: Module boundaries
        run: npm run boundaries
