<title>Mesh Field Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f7f4; --card:#ffffff; --ink:#111820; --ink-2:#48535e; --ink-3:#78838e;
  --rule:#d8ddd8; --rule-2:#ebeee9;
  --navy:#10365c; --saffron:#b4590f; --green:#0d6b41; --plum:#5c2f6b; --slate:#5b6b78;
  --bad:#a01f26; --bad-bg:#fbeeee; --ok-bg:#edf5ef; --warn:#8a6100;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Public Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
button{font:inherit}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--rule)}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:11px;color:var(--ink-3)}
#stats{display:flex}
.stat{padding:0 14px;border-left:1px solid var(--rule-2);display:flex;flex-direction:column;line-height:1.2}
.stat b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.head-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-size:12px;font-weight:600;padding:5px 12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f2ee;border-color:#c2c9c2}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#0c2a48}
.btn.primary.paused{background:var(--saffron);border-color:var(--saffron)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:#e0c2c4}
.btn.danger:hover{background:var(--bad-bg)}
.btn.wide{width:100%;margin-top:8px;padding:7px}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:224px minmax(0,1fr) 404px;min-height:0}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--rule)}
.col:last-child{border-right:0}
.col-head{padding:6px 13px;border-bottom:1px solid var(--rule);background:var(--card);display:flex;align-items:center;gap:10px;min-height:34px}
.col-head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.col-body{flex:1;min-height:0;overflow:auto;padding:11px 13px}
.col-body::-webkit-scrollbar{width:9px;height:9px}
.col-body::-webkit-scrollbar-thumb{background:#ccd3cc;border-radius:9px}

/* ---------- palette ---------- */
.pane{margin-bottom:15px}
.pane h3,.block h3{margin:0 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.add-grid{display:flex;flex-direction:column;gap:4px}
.add-btn{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border:1px solid var(--rule);background:var(--card);border-radius:3px;cursor:pointer;text-align:left}
.add-btn:hover:not(:disabled){border-color:#b7bfb7;background:#f1f3ef}
.add-btn:disabled{opacity:.42;cursor:default}
.ab-dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto;margin-top:3px;background:var(--slate)}
.ab-dot.navy{background:var(--navy)}.ab-dot.green{background:var(--green)}
.ab-dot.saffron{background:var(--saffron)}.ab-dot.plum{background:var(--plum)}
.ab-text{display:flex;flex-direction:column;min-width:0}
.ab-text b{font-size:12px;font-weight:600}
.ab-text small{font-size:10.5px;color:var(--ink-3);line-height:1.35}
.slider{display:block;margin-bottom:9px}
.s-top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-bottom:2px}
.s-top b{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.slider input{width:100%;accent-color:var(--navy);height:16px}
.preset-list{display:flex;flex-direction:column;gap:4px}
.preset{display:flex;flex-direction:column;padding:6px 8px;border:1px solid var(--rule);background:var(--card);border-radius:3px;cursor:pointer;text-align:left}
.preset:hover{border-color:#b7bfb7;background:#f1f3ef}
.preset b{font-size:12px;font-weight:600}
.preset small{font-size:10.5px;color:var(--ink-3);line-height:1.35}
.preset[aria-pressed=true]{border-color:var(--navy);background:#eef4f9}
.preset[aria-pressed=true] b{color:var(--navy)}
.group-label{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a4adb4;margin:9px 0 3px}
.group-label:first-of-type{margin-top:2px}

#scenario-bar{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
#scenario-bar b{font-size:12px;font-weight:700;flex:0 0 auto}
.sb-watch{font-size:11px;color:var(--ink-2);line-height:1.35;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-watch:hover{white-space:normal;overflow:visible}
.sb-hint{font-size:11px;color:var(--ink-3)}

/* ---------- stage ---------- */
.stage-wrap{flex:1;min-height:0;padding:10px;display:flex}
#stage{flex:1;min-height:0;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:4px;touch-action:none}
.region{fill:#f2f5f1;stroke:#dfe4de;stroke-width:1}
.region.on{fill:#f0f5f9;stroke:#cfdeea}
.region-label{font:700 11px var(--sans);fill:var(--ink-2);letter-spacing:.02em}
.region-sub{font:500 9.5px var(--mono);fill:var(--ink-3)}
.gap-label{font:500 9.5px var(--mono);fill:#a3aead}
.range{fill:rgba(16,54,92,.05);stroke:var(--navy);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.audio-range{fill:rgba(180,89,15,.045);stroke:var(--saffron);stroke-width:1;stroke-dasharray:2 5;opacity:.6}
.link{stroke:#9fb4c6;stroke-width:2}
.uplink{stroke:var(--plum);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.flight{fill:var(--navy)}
.burst{fill:none;stroke:var(--saffron);stroke-width:2}
.dev{cursor:grab}
.dev.sel{cursor:grabbing}
.dev-body{fill:#fff;stroke:var(--slate);stroke-width:1.6}
.dev.navy .dev-body{stroke:var(--navy)}
.dev.green .dev-body{stroke:var(--green)}
.dev.saffron .dev-body{stroke:var(--saffron);fill:#fdf6ef}
.dev.plum .dev-body{stroke:var(--plum);fill:#f8f3fa}
.dev.sel .dev-body{stroke-width:3}
.dev-line{stroke:#c3ccd3;stroke-width:1.5}
.dev-name{font:600 10px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.dev-sub{font:500 8.5px var(--mono);fill:var(--ink-3);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.pip{stroke:#fff;stroke-width:1.5}
.pip.gw{fill:var(--plum)}.pip.ear{fill:var(--saffron)}.pip.off{fill:#b9c1b9}

/* ---------- inspector ---------- */
#insp-head{padding:6px 13px;border-bottom:1px solid var(--rule);background:var(--card);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
#insp-head h2{margin:0;font-size:12.5px;font-weight:700;flex:0 0 auto}
.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-left:auto}
.tabs button{font-size:11px;font-weight:600;padding:3px 9px;border:0;border-right:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff}
#insp-head .btn{padding:3px 9px;font-size:11px}
.empty{color:var(--ink-3);font-size:12px;line-height:1.55;margin:4px 0}
.note{font-size:11.5px;color:var(--ink-2);margin:6px 0 0;line-height:1.5}
.block{margin-top:13px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:8px;align-items:baseline;padding:5px 9px;border-bottom:1px solid var(--rule-2);font-size:12px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-3);flex:0 0 auto}
.row .v{font-family:var(--mono);font-size:11.5px;margin-left:auto;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.empty-row{color:var(--ink-3);font-style:italic}
.link-row{cursor:pointer}
.link-row:hover{background:#f2f4f1}
.pad{padding:8px 9px}
.sub-head{padding:5px 9px;font-size:11.5px;font-weight:600;border-bottom:1px solid var(--rule-2)}
.sub-note{padding:5px 9px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.toggles{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}
.toggle input{accent-color:var(--navy);width:15px;height:15px;margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{font-size:11px;font-weight:600;padding:3px 9px;border:0;border-right:1px solid var(--rule);background:none;color:var(--ink-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.actions{display:flex;flex-direction:column;gap:4px}
.act{display:flex;flex-direction:column;gap:1px;padding:6px 9px;border:1px solid var(--rule);background:var(--card);border-radius:3px;cursor:pointer;text-align:left}
.act:hover:not(:disabled){border-color:#b7bfb7;background:#f1f3ef}
.act:disabled{opacity:.42;cursor:default}
.act b{font-size:12px;font-weight:600}
.act small{font-size:10.5px;color:var(--ink-3);line-height:1.4}
.act.bad b{color:var(--bad)}
.act.saffron b{color:var(--saffron)}

/* ---------- byte grid ---------- */
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:9px 0 7px}
.legend span{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.grid-wrap{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:8px 9px;overflow-x:auto}
.brow{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;line-height:1.85}
.boff{color:var(--ink-3);font-size:10px;width:26px;text-align:right;flex:0 0 auto;user-select:none;font-variant-numeric:tabular-nums}
.bcells{display:flex;gap:2px}
.byte{width:20px;padding:0;text-align:center;border-radius:2px;cursor:pointer;border:1px solid transparent;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.byte:hover{outline:1.5px solid var(--ink);outline-offset:-1px}
.byte.sel{outline:2px solid var(--ink);outline-offset:-1px;font-weight:700}
.g-navy{background:#dae7f3}.g-saffron{background:#fae1c8}.g-green{background:#d8ecdf}
.g-plum{background:#ebdff1}.g-slate{background:#e2e7ea}.g-none{background:#f2f4f1}
.g-key{background:#fae1c8}.g-value{background:#dae7f3}.g-count{background:#e2e7ea}.g-struct{background:#ebdff1}
.inspect{margin-top:8px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--navy);border-radius:3px;padding:8px 10px;min-height:58px}
.inspect b{display:block;font-size:12px;margin-bottom:2px}
.inspect .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-bottom:4px;word-break:break-all}
.inspect p{margin:0;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.inspect p.hint{margin-top:5px;color:var(--ink);font-family:var(--mono);font-size:11px}

/* ---------- gates + policy ---------- */
.verdict{padding:8px 10px;border-radius:3px;margin-bottom:9px;font-size:12px;line-height:1.45}
.verdict.ok{background:var(--ok-bg);border:1px solid #bcdcc9;color:var(--green)}
.verdict.no{background:var(--bad-bg);border:1px solid #e2bfc1;color:var(--bad)}
.verdict b{display:block;font-size:12.5px}
.verdict p{margin:2px 0 0;font-family:var(--mono);font-size:11px}
.gates{display:flex;flex-direction:column}
.gate{display:flex;align-items:center;gap:7px;padding:2.5px 8px;border-bottom:1px solid var(--rule-2);font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.gate:last-child{border-bottom:0}
.gate .num{width:15px;text-align:right;font-size:9.5px;color:#a4adb4}
.gate .dot{width:8px;height:8px;border-radius:50%;background:#dfe3df;flex:0 0 auto}
.gate.pass{color:var(--ink)}.gate.pass .dot{background:var(--green)}
.gate.stop{color:var(--bad);background:var(--bad-bg);font-weight:600}.gate.stop .dot{background:var(--bad)}
.gate.defer{color:var(--warn)}.gate.defer .dot{background:#e5c37a}
.gate .tag{margin-left:auto;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase}
.pol{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule-2);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.pol button{background:var(--card);border:0;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.pol button:hover{background:#f1f3ef}
.pol button[aria-pressed=true]{background:#eef4f9}
.pol .lbl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pol .val{font-family:var(--mono);font-size:11px;font-weight:600}
.u-head{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-bottom:5px}
.ubar{display:flex;height:15px;border-radius:3px;overflow:hidden;border:1px solid var(--rule);background:#f0f2ef}
.ulist{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px;font-size:10.5px;color:var(--ink-2);font-family:var(--mono)}
.ulist span{display:flex;align-items:center;gap:4px}
.ulist i{width:8px;height:8px;border-radius:2px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-2)}
.meters div{background:var(--card);padding:5px 8px}
.meters b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.meters span{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.meters div.hot b{color:var(--bad)}
.state-chip{margin-left:auto;font:600 9.5px var(--mono);padding:1px 6px;border-radius:2px;background:#eceef0;color:var(--ink-2);text-transform:none;letter-spacing:0}
.state-chip.resolved{background:var(--ok-bg);color:var(--green)}
.state-chip.cancelled,.state-chip.expired{background:#f1f2f0;color:var(--ink-3)}
.state-chip.created,.state-chip.active{background:var(--bad-bg);color:var(--bad)}

/* ---------- log ---------- */
.log{border-top:1px solid var(--rule);background:var(--card);height:168px;display:flex;flex-direction:column}
.log-head{display:flex;align-items:center;gap:5px;padding:4px 13px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.log-head h2{margin:0 8px 0 0;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.lf{font-size:10.5px;font-weight:600;padding:2px 7px;border:1px solid var(--rule);background:var(--card);border-radius:3px;cursor:pointer;color:var(--ink-3)}
.lf[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
#log-body{flex:1;min-height:0;overflow:auto;padding:3px 0;font-family:var(--mono);font-size:10.5px}
#log-body::-webkit-scrollbar{width:9px}
#log-body::-webkit-scrollbar-thumb{background:#ccd3cc;border-radius:9px}
.lrow{display:flex;gap:9px;padding:1.5px 13px;white-space:nowrap;color:var(--ink-2)}
.lrow:hover{background:#f4f6f2}
.lrow.warn{color:var(--warn)}
.lrow.err{color:var(--bad);background:var(--bad-bg)}
.lt{width:46px;text-align:right;color:#a4adb4;flex:0 0 auto;font-variant-numeric:tabular-nums}
.lc{width:96px;flex:0 0 auto;color:var(--ink-3)}
.lw{width:112px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis}
.lw.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.ln{width:136px;flex:0 0 auto;font-weight:600;color:var(--ink)}
.ld{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}

@media (max-width:1180px){
  .app{height:auto;min-height:100dvh}
  main{grid-template-columns:1fr}
  .col{border-right:0;border-bottom:1px solid var(--rule)}
  .col-body{overflow:visible}
  .stage-wrap{height:58vh}
  #stats .stat:nth-child(n+4){display:none}
}
@media (max-width:700px){
  #stats{display:none}
}
</style>

<div class="app">

<header>
  <div class="brand">
    <b>Mesh Field Simulator</b>
    <span>Disaster SOS Mesh &middot; running the real engine</span>
  </div>
  <div id="stats"></div>
  <div class="head-right">
    <button class="btn" id="clear">Clear world</button>
    <button class="btn primary" id="pause">Pause</button>
  </div>
</header>

<main>
  <section class="col">
    <div class="col-head"><h2>Build</h2></div>

    <div class="stage-wrap">

  <section class="col">
    <div id="insp-head"></div>
    <div class="col-body" id="insp-body"></div>
  </section>
</main>

<div class="log">
  <div class="log-head">
    <h2>Live diagnostics</h2>
    <div id="log-filters" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  </div>
  <div id="log-body"></div>
</div>

</div>
<script>
/*
 * RadioMedium.advance() drains whole macrotasks between scheduled callbacks so
 * multi-hop results depend on the protocol and not on microtask scheduling. It
 * prefers setImmediate and falls back to setTimeout(0) — which browsers clamp
 * to 4 ms, and to a full second in a background tab, stalling the simulation.
 *
 * A MessageChannel gives it a real, unclamped macrotask. Nothing about the
 * engine changes; it just gets the primitive it asks for first.
 */
(function () {
  if (typeof window.setImmediate === "function") return;
  var channel = new MessageChannel();
  var queue = [];
  channel.port1.onmessage = function () { var fn = queue.shift(); if (fn) fn(); };
  window.setImmediate = function (fn) { queue.push(fn); channel.port2.postMessage(0); };
})();
</script>

        next.add(key);
        if (!this.links.has(key)) {
          this.medium.connect(a.nodeToken, b.nodeToken);
          this.pushLog(a, { category: "peer-discovery", name: "in-range", severity: "debug",
            atMs: this.medium.clockMs, peerToken: b.nodeToken });
        }
      } else if (this.links.has(key)) {
        this.medium.disconnect(a.nodeToken, b.nodeToken);
        this.pushLog(a, { category: "peer-discovery", name: "out-of-range", severity: "debug",
          atMs: this.medium.clockMs, peerToken: b.nodeToken });
      }
    }
  }
  this.links = next;
};

World.prototype.onTransportEvent = function (node, ev) {
  if (ev.kind !== "record-sent") return;
  var peer = this.meshNodes().filter(function (n) { return n.nodeToken === ev.peerToken; })[0];
  if (!peer) return;
  this.flights.push({ from: node.id, to: peer.id, packetId: ev.packetId, bytes: ev.byteCount, at: performance.now() });
  if (this.flights.length > 40) this.flights.shift();
};

World.prototype.pushLog = function (node, event, label) {
  this.logLines.push({ who: label || (node ? node.name : "world"), whoId: node ? node.id : null, e: event });
  if (this.logLines.length > 600) this.logLines.splice(0, this.logLines.length - 600);
};

World.prototype.start = function () {
  this.started = true;
  var jobs = this.meshNodes().map(function (n) { return n.relay.start(); });
  return Promise.all(jobs);
};

/** One simulated step. Everything inside is the real engine doing the work. */
World.prototype.step = async function () {
  if (this.paused || this.stepping) return;
  this.stepping = true;
  try {
    await this.runStep();
  } finally {
    this.stepping = false;
  }
};

World.prototype.runStep = async function () {
  this.tick += 1;
  this.medium.options.lossRate = this.lossRate;

  this.updateProximity();

  var mesh = this.meshNodes();
  for (var i = 0; i < mesh.length; i++) {
    var n = mesh[i];
    n.engine.setBatteryBand(n.batteryBand);
    n.engine.setCoarseLocation(Math.round(n.latE7()), Math.round(n.lonE7()));
    if (n.relayOn && n.relay.isRunning) await n.relay.refreshAdvertisement();
  }
  await this.medium.advance(220 * this.speed);

  // Gateway cycle: probe, upload, download. Only a live probe may prove it.
  if (this.tick % 4 === 0) {
    for (var g = 0; g < mesh.length; g++) {
      var node = mesh[g];
      node.gatewayState.markProbing();
      try {
        var report = await node.gateway.sync();
        node.gatewayState.recordProbe({ proven: report.proven, atMs: this.medium.clockMs });
        if (report.uploaded) node.gatewayState.recordUpload(this.medium.clockMs);
        if (report.downloaded) node.gatewayState.recordDownload(this.medium.clockMs);
      } catch (e) {
        node.gatewayState.recordProbe({ proven: false, atMs: this.medium.clockMs });
      }
      node.gatewayState.setQueueDepth(await node.engine.packets.count());
    }
  }

  if (this.tick % 12 === 0) {
    for (var m = 0; m < mesh.length; m++) await mesh[m].engine.maintain(this.medium.clockMs);
  }

  await this.stepBroadcasts();
};

/* ---- Tier 2 broadcast progression ---------------------------------------- */

World.prototype.stepBroadcasts = async function () {
  var self = this;
  var towers = this.list().filter(function (n) { return n.kind === "radio" && n.broadcast; });
  for (var t = 0; t < towers.length; t++) {
    var tower = towers[t], b = tower.broadcast;
    if (b.index >= b.schedule.length) { tower.broadcast = null; continue; }
    var burst = b.schedule[b.index];
    b.index += 1;

    var listeners = this.meshNodes().filter(function (n) {
      return n.listening && self.distance(n, tower) <= tower.audioRange;
    });

    for (var f = 0; f < burst.frames.length; f++) {
      var frame = burst.frames[f];
      // The loss slider corrupts audio the way a noise burst would: one flipped
      // bit. The receiver's CRC-16 is what decides the frame is unusable.
      var wire = frame;
      if (this.lossRate > 0 && Math.random() < this.lossRate) {
        wire = frame.slice();
        wire[10 + (f % Math.max(1, wire.length - 12))] ^= 0x01;
      }
      for (var L = 0; L < listeners.length; L++) {
        var node = listeners[L];
        if (!node.tier2Resolver || node.tier2CampaignId !== tower.campaign.manifest.campaignId) {
          node.tier2 = new TIER2.Tier2Receiver(new TIER2.ManifestHandleResolver(tower.campaign.manifest, tower.campaignHandle));
          node.tier2.startListening("tier2-mic", this.medium.clockMs);
          node.tier2Resolver = true;
          node.tier2CampaignId = tower.campaign.manifest.campaignId;
        }
        var res = node.tier2.accept({ bytes: wire, source: "tier2-mic", receivedAtMs: this.medium.clockMs });
        this.pushLog(node, {
          category: "tier2", name: "frame", severity: res.reason === "tier2.frame-corrupt" ? "warn" : "debug",
          atMs: this.medium.clockMs, reason: res.reason, campaignId: tower.campaign.manifest.campaignId,
          bytes: wire.length
        });
        if (res.packet) {
          // The recovered packet enters through the SAME ingest as Bluetooth.
          await node.engine.ingest(res.packet.bytes, "tier2-mic", { campaignId: tower.campaign.manifest.campaignId });
        }
      }
    }
    tower.lastBurst = { at: performance.now(), packetId: burst.packetId, repeat: burst.repeatIndex };
    break; // one burst per tick keeps the schedule watchable
  }
};

function summariseIngest(node, bytes, transport, result) {
  var s = {
    at: node.world.medium.clockMs,
    transport: transport,
    bytes: bytes,
    accepted: result.accepted,
    packetId: result.packetId || null,
    storeOutcome: result.storeOutcome || null,
    validation: result.validation,
    policy: result.policy || null,
    mapOps: result.mapOperationsApplied
  };
  node.ingests.push(s);
  if (node.ingests.length > 25) node.ingests.shift();
  return s;
}

};

function nextSeq(node, incidentId) {
  node.seqByIncident = node.seqByIncident || {};
  node.seqByIncident[incidentId] = (node.seqByIncident[incidentId] || 1) + 1;
  return node.seqByIncident[incidentId];
}

async function runAction(node, key, incidentId) {
  var action = ACTIONS[key];
  var built;
  try {
    built = action.run(node, incidentId);
  } catch (err) {
    // e.g. buildOfficialAlert refuses a non-authority source class outright.
    node.world.pushLog(node, { category: "validation", name: "refused-at-source", severity: "error",
      atMs: node.world.medium.clockMs, reason: String(err.message || err) });
    return null;
  }
  await node.engine.createLocal(built.packet, built.incidentId);
  node.created.push({ packetId: built.packet.packetId, bytes: built.packet.bytes, at: node.world.medium.clockMs, action: key });
  if (node.created.length > 40) node.created.shift();
  UI.selectPacket(built.packet.bytes, node);
  return built.packet;
}

/* ---- Tier 2 campaign ------------------------------------------------------ */

async function buildCampaign(tower) {
  var w = tower.world;
  // Collect the authority records currently in the world worth broadcasting.
  var pool = [];
  w.list().forEach(function (n) {
    if (!n.created) return;
    n.created.forEach(function (c) {
      var d = CODEC.decodePacket(c.bytes);
      if (!d.ok) return;
      var t = d.packet.header.type;
      var privileged = d.packet.header.sourceClass === SourceClass.AUTHORITY_PROVISIONED ||
                       d.packet.header.sourceClass === SourceClass.BACKEND;
      if (!privileged) return;
      if (t === MessageType.OFFICIAL_ALERT || t === MessageType.ROUTE_STATE ||
          t === MessageType.SHELTER || t === MessageType.WEATHER_BULLETIN ||
          t === MessageType.CHECKIN_CAMPAIGN) {
        pool.push({ packetId: c.packetId, bytes: c.bytes, messageType: t,
          priority: d.packet.header.priority, severity: d.packet.header.severity });
      }
    });
  });
  if (pool.length === 0) return { error: "No authority records to broadcast yet. Add an authority console and publish an alert first." };

  var byId = new Map();
  pool.forEach(function (p) { byId.set(p.packetId, p); });
  var packets = Array.from(byId.values()).slice(0, TIER2_LIMITS.MAX_CAMPAIGN_PACKETS);

  tower.campaignSeq = (tower.campaignSeq || 0) + 1;
  tower.campaignHandle = tower.n * 100 + tower.campaignSeq;
  var nowS = CODEC.toEpochS(w.medium.clockMs);
  var plan;
  try {
    plan = TIER2.planCampaign({
      campaignId: "CMP-" + tower.n + "-" + tower.campaignSeq,
      campaignVersion: 1,
      campaignHandle: tower.campaignHandle,
      regionCode: w.regionCode,
      validFromS: nowS,
      validUntilS: nowS + 3600,
      requiredPackId: "PACK-ASSAM",
      requiredPackVersion: 1,
      profile: tower.profile || "audible-fast",
      packets: packets
    });
  } catch (err) {
    return { error: String(err.message || err) };
  }

  // Frames per packet, then the real interleaved burst schedule.
  var framesByHandle = new Map();
  packets.forEach(function (p, i) {
    framesByHandle.set(p.packetId, TIER2.toTier2Frames({
      campaignHandle: tower.campaignHandle, campaignVersion: 1, packetHandle: i + 1,
      messageType: p.messageType, priority: p.priority, severity: p.severity,
      payload: p.bytes.subarray(ENVELOPE.HEADER_BYTES)
    }));
  });
  var schedule = plan.manifest.burstSchedule.map(function (b) {
    return { packetId: b.packetId, repeatIndex: b.repeatIndex, frames: framesByHandle.get(b.packetId) };
  });

  tower.campaign = plan;
  return { plan: plan, schedule: schedule };
}

  world.list().forEach(function (n) {

      parts.push('<circle class="audio-range" cx="' + n.x + '" cy="' + n.y + '" r="' + n.audioRange + '"/>');
    }
  });

  // links
  world.links.forEach(function (key) {
    var ids = key.split("|");
    var a = world.node(ids[0]), b = world.node(ids[1]);
    if (!a || !b) return;
    parts.push('<line class="link" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>');
  });

  // gateway uplinks
  var backend = world.list().filter(function (n) { return n.kind === "backend"; })[0];
  if (backend) {
    world.meshNodes().forEach(function (n) {
      if (n.engine.isGatewayProven(world.medium.clockMs)) {
        parts.push('<line class="uplink" x1="' + n.x + '" y1="' + n.y + '" x2="' + backend.x + '" y2="' + backend.y + '"/>');
      }
    });
  }

  // packets in flight (driven by real record-sent transport events)
  var now = performance.now();
  world.flights = world.flights.filter(function (f) { return now - f.at < 900; });
  if (!REDUCED_MOTION) {
    world.flights.forEach(function (f) {
      var a = world.node(f.from), b = world.node(f.to);
      if (!a || !b) return;
      var t = Math.min(1, (now - f.at) / 900);
      parts.push('<circle class="flight" cx="' + (a.x + (b.x - a.x) * t) + '" cy="' + (a.y + (b.y - a.y) * t) + '" r="4"/>');
    });
  }

  // audio bursts
  world.list().forEach(function (n) {
    if (n.kind !== "radio" || !n.lastBurst) return;
    var age = now - n.lastBurst.at;
    if (age > 1200) return;
    var r = 28 + (age / 1200) * (n.audioRange - 28);
    parts.push('<circle class="burst" cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" opacity="' + (1 - age / 1200) * 0.55 + '"/>');
  });

  // devices
  world.list().forEach(function (n) { parts.push(deviceSvg(n)); });

  svg.innerHTML = parts.join("");
}

function deviceSvg(n) {
  var k = KINDS[n.kind];
  var selected = UI.selected === n.id;
  var out = '<g class="dev ' + k.accent + (selected ? " sel" : "") + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">';
  if (n.kind === "radio") {
    out += '<path class="dev-body" d="M-20 12 L0 -14 L20 12 Z"/>';
  } else if (n.kind === "backend") {
    out += '<rect class="dev-body" x="-22" y="-14" width="44" height="28" rx="3"/><line class="dev-line" x1="-14" y1="-4" x2="14" y2="-4"/><line class="dev-line" x1="-14" y1="4" x2="14" y2="4"/>';
  } else if (n.kind === "authority") {
    out += '<rect class="dev-body" x="-20" y="-15" width="40" height="30" rx="3"/><line class="dev-line" x1="-11" y1="15" x2="11" y2="15"/>';
  } else {
    out += '<rect class="dev-body" x="-13" y="-18" width="26" height="36" rx="4"/>';
  }

    if (n.listening) out += '<circle class="pip ear" cx="-14" cy="-16" r="4"/>';

}
function shortName(n) {
  var map = { public: "Phone", responder: "Responder", authority: "Authority", radio: "Radio", backend: "Centre" };

/* ---- adding and dragging --------------------------------------------------- */

function freeSpot() {
  for (var attempt = 0; attempt < 200; attempt++) {
    var r = REGIONS[attempt % 2];
    var x = r.x + 60 + Math.random() * (r.w - 120);
    var y = r.y + 60 + Math.random() * (r.h - 120);
    var clear = true;
    world.list().forEach(function (n) { if (Math.hypot(n.x - x, n.y - y) < 70) clear = false; });
    if (clear) return { x: x, y: y };
  }
  return { x: VIEW_W / 2, y: VIEW_H / 2 };
}

function addNodeInteractively(kind) {
  var spot = freeSpot();
  if (kind === "backend") { spot = { x: REGIONS[1].x + REGIONS[1].w - 60, y: REGIONS[1].y + 46 }; }
  if (kind === "radio") { spot = { x: VIEW_W / 2, y: 90 }; }
  var node = world.add(kind, spot.x, spot.y);
  if (kind === "radio") { node.audioRange = 260; node.profile = "audible-fast"; }
  UI.selected = node.id;
  renderAll();
}

function stagePoint(evt) {
  var svg = $("#stage");
  var rect = svg.getBoundingClientRect();
  return {
    x: ((evt.clientX - rect.left) / rect.width) * VIEW_W,
    y: ((evt.clientY - rect.top) / rect.height) * VIEW_H
  };
}

function bindStage() {
  var svg = $("#stage");
  svg.addEventListener("pointerdown", function (e) {
    var g = e.target.closest ? e.target.closest(".dev") : null;
    if (!g) { UI.selected = null; renderAll(); return; }
    var id = g.getAttribute("data-id");
    UI.selected = id;
    UI.dragging = id;
    svg.setPointerCapture(e.pointerId);
    renderAll();
  });
  svg.addEventListener("pointermove", function (e) {
    if (!UI.dragging) return;
    var n = world.node(UI.dragging);
    if (!n) return;
    var p = stagePoint(e);
    n.x = Math.max(24, Math.min(VIEW_W - 24, p.x));
    n.y = Math.max(24, Math.min(VIEW_H - 24, p.y));
    world.updateProximity();
    renderCanvas();
    renderInspector();
  });
  svg.addEventListener("pointerup", function (e) {
    if (UI.dragging) { UI.dragging = null; try { svg.releasePointerCapture(e.pointerId); } catch (x) {} renderAll(); }
  });
  svg.addEventListener("pointercancel", function () { UI.dragging = null; });
}

/** Walks the real deterministic value encoding to label each payload byte. */
function annotatePayload(bytes, messageType) {
  var spans = [], pos = 0;
  var TAG = ["uint", "nint", "bytes", "text", "false", "true", "array", "map"];
  var RESERVED = { 250: "__streamId", 251: "__sourceSequence", 252: "__geo" };
  function uvarint() {
    var start = pos, result = 0, shift = 1;
    for (;;) { var b = bytes[pos++]; result += (b & 0x7f) * shift; if ((b & 0x80) === 0) break; shift *= 128; }
    return { value: result, start: start, end: pos };
  }
  function value(name, nested) {
    var t0 = pos, tag = bytes[pos++];
    if (tag === 0 || tag === 1) {
      var v = uvarint(); var num = tag === 0 ? v.value : -1 - v.value;
      spans.push({ start: t0, end: pos, kind: "value", name: name, note: TAG[tag] + " = " + num });
      return num;
    }
    if (tag === 2 || tag === 3) {
      var len = uvarint(), s = pos; pos += len.value;
      var raw = bytes.slice(s, pos);
      var out = tag === 3 ? new TextDecoder().decode(raw) : hex(raw);
      spans.push({ start: t0, end: pos, kind: "value", name: name, note: TAG[tag] + "(" + len.value + ") = " + (tag === 3 ? JSON.stringify(out) : out) });
      return out;
    }
    if (tag === 4 || tag === 5) { spans.push({ start: t0, end: pos, kind: "value", name: name, note: String(tag === 5) }); return tag === 5; }
    if (tag === 6) {
      var count = uvarint();
      spans.push({ start: t0, end: pos, kind: "struct", name: name, note: "array of " + count.value });
      var arr = []; for (var i = 0; i < count.value; i++) arr.push(value(name + "[" + i + "]", nested));
      return arr;
    }
    if (tag === 7) { spans.push({ start: t0, end: pos, kind: "struct", name: name, note: "nested map" }); return body(nested, name); }
    throw new Error("tag " + tag);
  }
  function body(map, prefix) {
    var count = uvarint();
    spans.push({ start: count.start, end: count.end, kind: "count", name: (prefix ? prefix + " " : "") + "field count", note: count.value + " fields follow" });
    var reverse = map ? CODEC.reverseFieldMap(map) : undefined;
    var out = {};
    for (var i = 0; i < count.value; i++) {
      var key = uvarint();
      var name = (reverse && reverse.get(key.value)) || RESERVED[key.value] || ("key " + key.value);
      spans.push({ start: key.start, end: key.end, kind: "key", name: "key " + key.value, note: 'wire key ' + key.value + ' → "' + name + '"' });
      out[name] = value(name, CODEC.NESTED_FIELD_MAPS[name]);
    }
    return out;
  }
  var base = CODEC.FIELD_MAP_BY_TYPE[messageType] || {};
  var map = Object.assign({}, base, { __streamId: 250, __sourceSequence: 251, __geo: 252 });
  var decoded;
  try { decoded = body(map, ""); } catch (e) { return { spans: spans, decoded: {}, error: String(e.message || e) }; }
  return { spans: spans, decoded: decoded };
}

      var f = fieldAt(off, view);
      var cell = el("button", "byte g-" + f.group, arr[off].toString(16).padStart(2, "0"));
      cell.type = "button";
      if (UI.sel !== null && off >= f.start && off < f.start + f.size) cell.classList.add("sel");
      cell.title = f.label;
      (function (o) { cell.onclick = function () { UI.sel = o; renderInspector(); }; })(off);
      cells.appendChild(cell);
    }
    row.appendChild(cells);
    grid.appendChild(row);
  }
  wrap.appendChild(grid);
  body.appendChild(wrap);

  var box = el("div", "inspect");

  } else {
    var f = fieldAt(UI.sel, view);
    var slice = arr.slice(f.start, f.start + f.size);
    var hs = slice.map(function (b) { return b.toString(16).padStart(2, "0"); }).join(" ");
    var num = null;
    if (f.size <= 4) { num = 0; for (var q = 0; q < slice.length; q++) num = num * 256 + slice[q]; }

    box.appendChild(el("div", "meta", "offset " + f.start + (f.size > 1 ? "–" + (f.start + f.size - 1) : "") + " · " + f.size + " B · " + hs + (num !== null ? " · = " + num : "")));

      body.appendChild(cb);
      owner.engine.packets.getCustody(header.packetId).then(function (c) {
        slot.innerHTML = "";
        if (!c) { slot.appendChild(el("div", "row empty-row", "not held by this device")); return; }
        var budget = CLASS_BUDGETS[CODEC.budgetClassFor(header.type, header.severity)];
        var rows = el("div", "rows");
        [["state", c.state],
         ["copies made", c.copiesMade + " of " + budget.copyBudget],
         ["budget left", String(c.copyBudgetRemaining)],
         ["peers known to hold it", String(c.knownHolders.length)],
         ["upload state", c.uploadState],
         ["link receipts", String(c.linkReceiptCount)]].forEach(function (p) {
          var r = el("div", "row");
          r.appendChild(el("span", "k", p[0]));
          r.appendChild(el("span", "v", p[1]));
          rows.appendChild(r);
        });
        slot.appendChild(rows);
      });
    }
  }

  if (view.kind === "payload" && view.ann) {
    var d = el("div", "block");
    d.appendChild(el("h3", null, "Decoded payload"));
    var pairs = Object.keys(view.ann.decoded).map(function (k) {
      var v = view.ann.decoded[k];
      return [k.replace(/^__/, ""), typeof v === "object" ? JSON.stringify(v) : String(v)];
    });
    d.appendChild(rowsCard(pairs));
    d.appendChild(el("p", "note", "No field names on the wire: every name is a one-byte key, every enum a number, every coordinate an integer times 1e7 — written in ascending key order so the bytes are deterministic."));
    body.appendChild(d);
  }
}

function fieldAt(off, view) {
  if (view.kind === "envelope") {
    for (var i = 0; i < HEADER_LAYOUT.length; i++) {
      var f = HEADER_LAYOUT[i];
      if (off >= f.off && off < f.off + f.size) return { group: GROUP[f.key], label: f.label, note: f.note, start: f.off, size: f.size };
    }
  } else if (view.ann) {
    for (var j = 0; j < view.ann.spans.length; j++) {
      var s = view.ann.spans[j];
      if (off >= s.start && off < s.end) return { group: s.kind, label: s.name, note: s.note, start: s.start, size: s.end - s.start };
    }
  }
  return { group: "none", label: "unmapped", note: "", start: off, size: 1 };
}

function decodeHint(f, num, view) {
  if (view.kind !== "envelope" || num === null) return null;
  if (f.label.indexOf("Message type") === 0) return "0x" + num.toString(16) + " = " + TYPE_NAME[num];
  if (f.label.indexOf("Priority") === 0) return "priority " + (num >> 4) + " = " + PRIORITY_NAME[num >> 4] + "   ·   severity " + (num & 15) + " = " + SEVERITY_NAME[num & 15];
  if (f.label.indexOf("Flags") === 0) {
    var names = [];
    Object.keys(Flags).forEach(function (k) { if (num & Flags[k]) names.push(k); });
    return names.length ? "set: " + names.join(", ") : "no flags set";
  }
  if (f.label.indexOf("Source class") === 0) return num + " = " + SOURCECLASS_NAME[num];
  if (f.label.indexOf("Created") === 0 || f.label.indexOf("Expires") === 0) {
    return new Date(TIME.DEMO_EPOCH_MS + num * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC";
  }
  return null;
}

  /* ---- the radio path ---------------------------------------------------- */
  {

];

function radioTower() {
  return world.list().filter(function (n) { return n.kind === "radio"; })[0];
}

/** Plans a campaign from the authority records in the world and starts it. */
function startBroadcast(tower) {
  if (!tower) return Promise.resolve(null);
  return buildCampaign(tower).then(function (r) {
    if (r.error) { tower.error = r.error; return null; }
    tower.error = null;
    tower.broadcast = { schedule: r.schedule, index: 0 };
    // A new campaign means every listener needs a fresh resolver.
    world.meshNodes().forEach(function (n) { n.tier2Resolver = false; });
    return r;
  });
}

function loadPreset(preset) {
  world.list().forEach(function (n) { world.remove(n.id); });
  world.logLines.length = 0;
  world.lossRate = preset.loss || 0;
  world.scenario = preset;
  // Fresh centre per scenario: nodes below take their client from it, and a
  // carried-over dedup cache would refuse the new run's uploads as duplicates.
  world.backend = new MockBackend(world);
  world.incidentSeq = 0;
  world.alertSeq = 0;
  UI.packet = null; UI.sel = null; UI.lastIngest = null;
  var focus = preset.build();
  UI.selected = focus ? focus.id : null;
  renderAll();
  world.start().then(function () {
    renderAll();
    // Give the relays a moment to advertise before the opening move.
    if (preset.open && focus) setTimeout(function () { preset.open(focus).then(renderAll); }, 600);
  });
}

/* ---- shell -------------------------------------------------------------------- */

function renderScenarioBar() {
  var bar = $("#scenario-bar");
  bar.innerHTML = "";
  if (!world.scenario) {
    bar.appendChild(el("span", "sb-hint", "drag to move \u00b7 click to inspect \u00b7 Delete removes"));
    return;
  }
  bar.appendChild(el("b", null, world.scenario.name));
  bar.appendChild(el("span", "sb-watch", world.scenario.watch));
}

function renderAll() {
  renderPalette();
  renderScenarioBar();
  renderCanvas();
  renderInspector();
  renderStats();
  renderLog();
}

var busy = false;
function loop() {
  if (!busy) {
    busy = true;
    world.step().catch(function (e) { console.error(e); }).then(function () {
      busy = false;
      renderCanvas();
      renderStats();
      renderLog();
      if (UI.tab !== "packet") renderInspector();
    });
  }
  requestAnimationFrame(function () { renderCanvas(); });
}

function boot() {
  // Start the clock at a real wall time so created/expiry values are real seconds.
  world.medium.advance(Date.UTC(2026, 7, 22, 9, 14, 0)).then(function () {
    bindStage();
    loadPreset(PRESETS[0]);
    UI.loopTimer = setInterval(loop, 320);
    UI.paintTimer = setInterval(function () { if (!world.paused) renderCanvas(); }, 60);
  });

  $("#pause").onclick = function () {
    world.paused = !world.paused;
    $("#pause").textContent = world.paused ? "Resume" : "Pause";
    $("#pause").classList.toggle("paused", world.paused);
  };
  $("#clear").onclick = function () {
    world.list().forEach(function (n) { world.remove(n.id); });
    world.logLines.length = 0;
    world.backend = new MockBackend(world);
    world.scenario = null;
    UI.selected = null; UI.packet = null; UI.lastIngest = null;
    renderAll();
  };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { $("#pause").click(); e.preventDefault(); }
    if (e.key === "Delete" && UI.selected) { world.remove(UI.selected); UI.selected = null; renderAll(); }
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* Handy from the browser console: __sim.world.nodes, __sim.world.backend, etc. */
window.__sim = {
  world: world, UI: UI, ACTIONS: ACTIONS, runAction: runAction, render: renderAll,
  /** Stop the automatic loop so steps can be driven one at a time. */
  pauseLoop: function () { clearInterval(UI.loopTimer); UI.loopTimer = null; },
  resumeLoop: function () { if (!UI.loopTimer) UI.loopTimer = setInterval(loop, 320); },
  /** Run n simulated steps back to back, ignoring the pause button. */
  drive: function (n) {
    var p = Promise.resolve();
    for (var i = 0; i < n; i += 1) p = p.then(function () { return world.step(); });
    return p.then(renderAll);
  }
};

})();

</script>
